# Routing by severity (taken from twa-observability). The page and ticket alerts go to Slack: the webhook is read from
# secrets/slack-webhook-url (ignored by git), never from this YAML. Without that file Alertmanager starts the same,
# the notifications fail and AlertmanagerNotificationsFailing says so; the alerts are always in http://localhost:9093.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  # The rollback already happened when CatalogRolloutRolledBack fires: it is notified without waiting for a group
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [alertname="Watchdog"]
      receiver: deadman
      repeat_interval: 1m
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
    - matchers: [severity="ticket"]
      receiver: ticket
      group_by: [service]
      repeat_interval: 12h
    - matchers: [severity="info"]
      receiver: default

inhibit_rules:
  # Without instances of the monolith, the rest of its alerts are noise
  - source_matchers: [alertname="TwaMonolithAbsent"]
    target_matchers: [alertname!="TwaMonolithAbsent"]
    equal: [service]
  # A page of the rollout silences the ticket/info of the same service
  - source_matchers: [severity="page"]
    target_matchers: [severity=~"ticket|info"]
    equal: [service]

receivers:
  - name: default
  - name: deadman
    # An external dead man's switch (healthchecks.io self-hosted, Uptime Kuma) waits for this ping every minute
    # webhook_configs:
    #   - url_file: /etc/alertmanager/secrets/deadman-url
  - name: page
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: "#flights-alerts"
        send_resolved: true
        title: '{{ template "slack.twa.title" . }}'
        text: '{{ template "slack.twa.text" . }}'
  - name: ticket
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: "#flights-tickets"
        send_resolved: true
        title: '{{ template "slack.twa.title" . }}'
        text: '{{ template "slack.twa.text" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
