# Load balancer of the two instances of the monolith (prerequisite P1, M2 C4).
# The resolver of Docker every 5 s: a restarted instance can come back with another IP.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream monolith {
    zone monolith 64k;
    server twa-flights-monolith:8080 resolve max_fails=1 fail_timeout=10s;
    server twa-flights-monolith-2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;

    location / {
        proxy_pass http://monolith;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Only the failures of the connection go to the other instance: a 503 of the search (catalog unavailable) is
        # an answer of the application and reaches the user, as decision 1 of the extraction plan says
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
