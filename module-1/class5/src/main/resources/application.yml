server:
  port: 8080
  servlet:
    context-path: /api/flights
  jetty:
    threads:
      max: 50
      min: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: twa-flights-monolith
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3320}/${DB_NAME:flights}?autoReconnect=true"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:muppet}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

connector:
  provider-alpha:
    host: ${PROVIDER_ALPHA_HOST:http://localhost:8585/rest/provider-alpha/1.0}
    connectionTimeout: 5000 #MILLISECONDS
    readTimeout: 5000 #MILLISECONDS
  provider-beta:
    host: ${PROVIDER_BETA_HOST:http://localhost:8585/rest/provider-beta/1.0}
    connectionTimeout: 5000 #MILLISECONDS
    readTimeout: 5000 #MILLISECONDS
  provider-gamma:
    host: ${PROVIDER_GAMMA_HOST:http://localhost:8585/rest/provider-gamma/1.0}
    connectionTimeout: 5000 #MILLISECONDS
    readTimeout: 5000 #MILLISECONDS

pricing:
  api-key: ${PRICING_API_KEY:twa-pricing-local-key}

jobs:
  cluster-search-cleanup:
    fixed-delay: 60000 #MILLISECONDS
