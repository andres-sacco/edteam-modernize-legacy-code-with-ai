global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # The instances are found by the DNS of Docker: with 2 instances of the monolith (prerequisite P1) each one is a
  # target of its own with its own label instance, and the guard (that decides with the traffic of its instance) is
  # watched per instance
  - job_name: twa-flights-monolith
    metrics_path: /api/flights/actuator/prometheus
    dns_sd_configs:
      - names: ["twa-flights-monolith", "twa-flights-monolith-2"]
        type: A
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      # instance is the name of the container, not its IP: a restarted instance keeps its series
      - source_labels: [__meta_dns_name]
        target_label: instance
      - target_label: service
        replacement: twa-flights-monolith
      - target_label: team
        replacement: flights

  - job_name: twa-flights-catalog
    metrics_path: /api/catalog/actuator/prometheus
    dns_sd_configs:
      - names: ["twa-flights-catalog"]
        type: A
        port: 8081
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: twa-flights-catalog
      - target_label: team
        replacement: catalog
